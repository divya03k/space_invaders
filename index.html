<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #00111f, #000);
      font-family: "Poppins", sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
      width: 360px;
    }
    h1 {
      font-size: 3rem;
      color: cyan;
      text-shadow: 0 0 15px cyan;
      margin-bottom: 2rem;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 1.1rem;
      cursor: pointer;
      margin: 15px 0;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background-color: #00bcd4;
      transform: scale(1.05);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .modal-content {
      background: #0c1a26;
      padding: 30px;
      border-radius: 15px;
      width: 340px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-content h2 {
      text-align: center;
      color: cyan;
      margin-bottom: 15px;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      outline: none;
      font-size: 1rem;
    }
    .login-btn {
      width: 100%;
      background: #00bcd4;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-btn:hover {
      background: #0097a7;
    }
    .close {
      float: right;
      font-size: 20px;
      cursor: pointer;
      color: #aaa;
    }
    .close:hover {
      color: white;
    }
    .neon-border {
      box-shadow: 0 0 10px cyan, inset 0 0 10px cyan;
    }
    .error {
      color: #ff6666;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Quiz</h1>
    <button class="btn" id="playerLoginBtn">Login as Player</button>
    <button class="btn" id="adminLoginBtn">Login as Admin</button>
  </div>

  <!-- Player Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content neon-border">
      <span class="close" id="closePlayer">&times;</span>
      <h2>Player Login</h2>
      <form id="playerForm">
        <input type="email" id="playerEmail" placeholder="Email" required />
        <input type="password" id="playerPassword" placeholder="Password" required />
        <button type="submit" class="login-btn">Login</button>
        <div id="playerError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content neon-border">
      <span class="close" id="closeAdmin">&times;</span>
      <h2>Admin Login</h2>
      <form id="adminForm">
        <input type="email" id="adminEmail" placeholder="Email" required />
        <input type="password" id="adminPassword" placeholder="Password" required />
        <button type="submit" class="login-btn">Login</button>
        <div id="adminError" class="error"></div>
      </form>
    </div>
  </div>

  <script>
    // 🎮 Modal Controls
    const playerModal = document.getElementById("playerModal");
    const adminModal = document.getElementById("adminModal");

    document.getElementById("playerLoginBtn").onclick = () => playerModal.style.display = "flex";
    document.getElementById("adminLoginBtn").onclick = () => adminModal.style.display = "flex";
    document.getElementById("closePlayer").onclick = () => playerModal.style.display = "none";
    document.getElementById("closeAdmin").onclick = () => adminModal.style.display = "none";
    window.onclick = (e) => {
      if (e.target === playerModal) playerModal.style.display = "none";
      if (e.target === adminModal) adminModal.style.display = "none";
    };

    // 🧑‍🎓 Player Login
    document.getElementById("playerForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = playerEmail.value;
      const password = playerPassword.value;
      const err = playerError;
      err.textContent = "";
      try {
        const res = await fetch("https://space-invaders-cddi.onrender.comapi/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, role: "player" })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("playerName", data.name);
          localStorage.setItem("role", "player");
          window.location.href = "game.html";
        } else {
          err.textContent = data.message || "Invalid credentials";
        }
      } catch {
        err.textContent = "Server error.";
      }
    };

    // 👩‍💼 Admin Login
    document.getElementById("adminForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = adminEmail.value;
      const password = adminPassword.value;
      const err = adminError;
      err.textContent = "";
      try {
        const res = await fetch("https://space-invaders-cddi.onrender.comapi/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, role: "admin" })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("adminName", data.name);
          localStorage.setItem("role", "admin");
          window.location.href = "admin.html";
        } else {
          err.textContent = data.message || "Invalid credentials";
        }
      } catch {
        err.textContent = "Server error.";
      }
    };
  </script>
</body>
</html>
