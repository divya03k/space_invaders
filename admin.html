<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Space Invaders</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #00111f, #000);
      font-family: "Poppins", sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(0,0,0,0.6);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px cyan;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      font-size: 2.5rem;
      color: cyan;
      text-shadow: 0 0 15px cyan;
      margin-bottom: 2rem;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid cyan;
      background: #0c1a26;
      color: cyan;
      font-size: 1rem;
    }

    .btn {
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,188,212,0.5);
    }

    .btn:hover {
      background: cyan;
      transform: scale(1.03);
      box-shadow: 0 0 20px cyan;
    }

    .msg { margin-top: 12px; font-size: 0.95rem; }
    .success { color: #4CAF50; }
    .error { color: #ff6666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Space Invaders Login</h1>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <select id="role" required>
        <option value="" disabled selected>Select Role</option>
        <option value="player">Player</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit" class="btn">Login</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>

  <script>
    const API_BASE = 'https://space-invaders-cddi.onrender.com/api';

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      const msg = document.getElementById('loginMsg');
      msg.textContent = 'Logging in...';
      msg.className = 'msg';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          localStorage.setItem('name', data.name);

          msg.textContent = 'Login successful!';
          msg.className = 'msg success';

          // Redirect based on role
          if (data.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/index.html'; // your game page
          }

        } else {
          msg.textContent = data.message || 'Login failed';
          msg.className = 'msg error';
        }

      } catch (err) {
        msg.textContent = 'Network error. Try again.';
        msg.className = 'msg error';
      }
    };
  </script>
</body>
</html>
